name: App CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Astro Quality Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          check-latest: true
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install chromium

      - name: Security audit
        working-directory: app
        run: npm audit --audit-level=critical --omit=dev

      - name: Quality checks (oxlint, astro check, Vitest, images)
        working-directory: app
        run: npm run check

      - name: Build
        working-directory: app
        run: npm run build

      - name: Lighthouse
        id: lighthouse
        working-directory: app
        run: node scripts/lighthouse-pr.ts "$RUNNER_TEMP/lighthouse"

      - name: Upload Lighthouse report
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: ${{ runner.temp }}/lighthouse/
          if-no-files-found: error
          retention-days: 14
