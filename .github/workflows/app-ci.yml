name: App CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "app/**"
      - "content/**"
      - "mise.toml"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/app-release.yml"

jobs:
  quality:
    name: Astro Quality Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install chromium

      - name: Install image optimization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Optimize OG images
        working-directory: app
        run: ./scripts/optimize-og-images.sh

      - name: Security audit
        working-directory: app
        run: npm audit --audit-level=critical --omit=dev

      - name: Quality checks (oxlint, astro check, Vitest, images)
        working-directory: app
        run: npm run check

      - name: Build
        working-directory: app
        run: npm run build
