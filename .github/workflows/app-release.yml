name: App Release

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "content/**"
      - ".github/workflows/app-release.yml"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Deploy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 30
    environment: production (app)

    env:
      GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
      GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
      GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create .env file
        run: |
          : > ./app/.env
          if [[ -n "${{ env.GA_MEASUREMENT_ID }}" ]]; then
            echo "PUBLIC_GA_MEASUREMENT_ID=${{ env.GA_MEASUREMENT_ID }}" >> ./app/.env
          fi
          if [[ -n "${{ env.GISCUS_REPO_ID }}" ]]; then
            echo "PUBLIC_GISCUS_REPO_ID=${{ env.GISCUS_REPO_ID }}" >> ./app/.env
            echo "PUBLIC_GISCUS_CATEGORY_ID=${{ env.GISCUS_CATEGORY_ID }}" >> ./app/.env
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install chromium

      - name: Install image optimization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Optimize OG images
        working-directory: app
        run: ./scripts/optimize-og-images.sh

      - name: Build
        working-directory: app
        run: npm run build

      - name: Deploy Worker
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
