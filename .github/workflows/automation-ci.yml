name: Automation CI

on:
  workflow_call:

jobs:
  automation:
    name: Workflow, script and doc checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: jdx/mise-action@v5

      # mise-action caches the resolved patch for up to 30 days.
      - name: Use the newest Node.js patch
        run: mise upgrade node

      - name: Lint workflows and scripts
        run: mise run check:automation

      - name: Lint Markdown docs
        run: mise run check:docs
