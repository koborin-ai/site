name: Infrastructure Plan

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "infra/**"
      - ".github/workflows/plan-infra.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack to preview"
        required: true
        default: "dev"
        type: choice
        options:
          - shared
          - dev
          - prod

jobs:
  terraform-plan:
    if: github.actor != 'dependabot[bot]'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    timeout-minutes: 30

    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      PROJECT_NUMBER: ${{ secrets.PROJECT_NUMBER }}
      REGION: asia-northeast1
      WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT_MAIL }}
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      IAP_USER: ${{ secrets.IAP_USER }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.8"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Decide target stack
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "INFRA_STACK=dev" >> "$GITHUB_ENV"
          else
            echo "INFRA_STACK=${{ github.event.inputs.stack }}" >> "$GITHUB_ENV"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Get current Cloud Run image (if exists)
        if: env.INFRA_STACK != 'shared'
        id: current-image
        run: |
          if [ "$INFRA_STACK" = "prod" ]; then
            SERVICE_NAME="koborin-ai-web-prod"
          else
            SERVICE_NAME="koborin-ai-web-dev"
          fi
          CURRENT_IMAGE=$(gcloud run services describe "${SERVICE_NAME}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "gcr.io/cloudrun/hello")
          echo "CURRENT_IMAGE=${CURRENT_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Current image: ${CURRENT_IMAGE}"

      - name: Synth and Terraform Plan
        working-directory: infra
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          TERRAFORM_BACKEND: gcs
          TERRAFORM_STATE_BUCKET: ${{ env.BUCKET_NAME }}
          TF_VAR_oauth_client_id: ${{ env.OAUTH_CLIENT_ID }}
          TF_VAR_oauth_client_secret: ${{ env.OAUTH_CLIENT_SECRET }}
          TF_VAR_iap_user: ${{ env.IAP_USER }}
          TF_VAR_image_uri: ${{ steps.current-image.outputs.CURRENT_IMAGE }}
        run: |
          set -euo pipefail
          dart pub get
          dart analyze
          dart run bin/synth.dart "${INFRA_STACK}"
          cd "tf-out/${INFRA_STACK}"
          terraform init -input=false
          terraform plan -no-color -input=false | tee "${GITHUB_WORKSPACE}/terraform-plan.txt"

      - name: Post plan summary
        run: |
          {
            echo "## Terraform Plan (${INFRA_STACK})"
            echo '```'
            tail -n 80 "${GITHUB_WORKSPACE}/terraform-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
