name: Infrastructure Plan

on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: jdx/mise-action@v5

      - name: Analyze and test
        run: mise run check:infra

  plan:
    needs: check
    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    concurrency:
      group: terraform-state
      cancel-in-progress: false
    timeout-minutes: 30

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: jdx/mise-action@v5

      # mise-action caches the resolved patch for up to 30 days.
      - name: Use the newest Node.js patch
        run: mise upgrade node

      - name: Fetch Dart packages
        working-directory: infra
        run: dart pub get

      - name: Plan
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_CLI_ARGS: -no-color
        run: |
          set -euo pipefail
          dart run terradart_cli:terradart plan | tee "${GITHUB_WORKSPACE}/terraform-plan.txt"

      - name: Post plan summary
        run: |
          {
            echo "## Infrastructure plan (site)"
            echo '```'
            tail -n 80 "${GITHUB_WORKSPACE}/terraform-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
