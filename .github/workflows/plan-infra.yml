name: Infrastructure Plan

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "infra/**"
      - ".github/workflows/plan-infra.yml"
  workflow_dispatch:

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform-plan:
    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.4"

      - name: Synth
        working-directory: infra
        env:
          TERRAFORM_STATE_BUCKET: koborin-ai-tfstate
          SITE_APEX_CONTENT: ${{ vars.SITE_APEX_CONTENT }}
          SITE_APEX_TTL: ${{ vars.SITE_APEX_TTL }}
          SITE_APEX_PROXIED: ${{ vars.SITE_APEX_PROXIED }}
          SITE_ATTACH_CUSTOM_DOMAIN: ${{ vars.SITE_ATTACH_CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          dart pub get
          dart analyze
          dart run bin/synth.dart site

      - name: Terraform Plan
        working-directory: infra/tf-out/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform plan -no-color -input=false | tee "${GITHUB_WORKSPACE}/terraform-plan.txt"

      - name: Post plan summary
        run: |
          {
            echo "## Terraform Plan (site)"
            echo '```'
            tail -n 80 "${GITHUB_WORKSPACE}/terraform-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
