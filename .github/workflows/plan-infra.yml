name: Infrastructure Plan

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Analyze and test
        run: mise run check:infra

  plan:
    needs: check
    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-state
      cancel-in-progress: false
    timeout-minutes: 30

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # mise-action caches the resolved patch for up to 30 days.
      - name: Use the newest Node.js patch
        run: mise upgrade node

      - name: Fetch Dart packages
        working-directory: infra
        run: dart pub get

      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token

      - name: Adopt the R2 state into GCS
        working-directory: infra
        env:
          TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          GCS_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: dart run tool/adopt_state.dart

      - name: Plan
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_CLI_ARGS: -no-color
        run: |
          set -euo pipefail
          dart run terradart_cli:terradart plan | tee "${GITHUB_WORKSPACE}/terraform-plan.txt"

      - name: Post plan summary
        run: |
          {
            echo "## Infrastructure plan (site)"
            echo '```'
            tail -n 80 "${GITHUB_WORKSPACE}/terraform-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
