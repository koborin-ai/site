name: Infrastructure Release

on:
  push:
    branches:
      - main
    paths:
      # Toolchain files are deliberately absent: a shellcheck bump should not
      # apply production infrastructure. plan-infra covers them on the PR.
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform-apply:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 30
    environment: production (infra)

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # mise-action caches the resolved patch for up to 30 days.
      - name: Use the newest Node.js patch
        run: mise upgrade node

      - name: Analyze and test
        run: mise run check:infra

      - name: Plan
        working-directory: infra
        env: &cloudflare_state
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_CLI_ARGS: -no-color
        run: dart run terradart_cli:terradart plan

      - name: Apply
        working-directory: infra
        env: *cloudflare_state
        run: dart run terradart_cli:terradart apply --auto-approve

      - name: Plan (verify no drift)
        working-directory: infra
        env: *cloudflare_state
        run: |
          set +e
          dart run terradart_cli:terradart plan --detailed-exitcode
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "Infrastructure drift detected after apply"
            exit 1
          fi
          if [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi
