name: Infrastructure Release

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
    tags:
      - "infra-v*"
  workflow_dispatch:

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 30
    environment: production (infra)

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.4"

      - name: Synth Terraform config
        working-directory: infra
        env:
          TERRAFORM_STATE_BUCKET: koborin-ai-tfstate
          SITE_APEX_CONTENT: ${{ vars.SITE_APEX_CONTENT }}
          SITE_APEX_TTL: ${{ vars.SITE_APEX_TTL }}
          SITE_APEX_PROXIED: ${{ vars.SITE_APEX_PROXIED }}
          SITE_ATTACH_CUSTOM_DOMAIN: ${{ vars.SITE_ATTACH_CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          dart pub get
          dart analyze
          dart run bin/synth.dart site

      - name: Terraform Init
        working-directory: infra/tf-out/site
        run: terraform init -input=false

      - name: Terraform Plan (pre-apply)
        working-directory: infra/tf-out/site
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        working-directory: infra/tf-out/site
        run: terraform apply -auto-approve -input=false

      - name: Terraform Plan (verify no drift)
        working-directory: infra/tf-out/site
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "Terraform state drift detected after apply"
            exit 1
          fi
          if [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi
