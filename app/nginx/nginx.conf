worker_processes  1;

events {
  worker_connections  1024;
}

http {
  server {
    listen 8080;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;
    absolute_redirect off;

    # UTF-8 charset for text files (fixes llms.txt encoding)
    charset utf-8;
    charset_types text/plain text/css application/json;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    error_page 404 /404.html;
    location = /404.html {
            root /usr/share/nginx/html;
            internal;
    }

    # Static assets with content hash - cache for 1 year
    location /_astro/ {
            gzip on;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
    }

    # OG images - serve WebP version when PNG/JPEG is requested
    location ~ ^/og/(.+)\.(png|jpe?g)$ {
            set $webp_file /og/$1.webp;
            try_files $webp_file $uri =404;
            expires 7d;
            add_header Cache-Control "public";
    }

    # OG images - WebP files directly
    location /og/ {
            expires 7d;
            add_header Cache-Control "public";
    }

    # Favicon - cache for 1 month
    location = /favicon.png {
            expires 30d;
            add_header Cache-Control "public";
    }

    # Beat audio files
    location /audio/ {
            expires 7d;
            add_header Cache-Control "public";
            add_header Accept-Ranges bytes;
    }

    location / {
            try_files $uri $uri/index.html =404;
    }
  }
}

